name: Pull request to main branch

on:
  pull_request:

jobs:
  run-tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        version: ["3.12", "3.13"]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python ${{ matrix.version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install '.[tests]'

      - name: Test with pytest
        run: |
          pytest
  crosscheck:
    # Point-for-point comparison with the official reference code
    # (tests/test_crosscheck_*.py). The other jobs skip these tests.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install '.[tests]'

      - name: Fetch the reference implementations
        run: |
          bash scripts/fetch_references.sh "$RUNNER_TEMP/references"

      - name: Cross-check against the reference implementations
        env:
          BBOB_JAX_REQUIRE_REFERENCES: "1"
        run: |
          export BBOB_JAX_REFERENCES="$RUNNER_TEMP/references"
          pytest tests/test_crosscheck_*.py -rsxX
  build-docs:
    strategy:
      matrix:
        os: [ubuntu-latest]
        version: ["3.12"]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python ${{ matrix.version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --editable '.[docs,plot]'
      - name: Build documentation
        run: |
          mkdocs build
  check_pre-commit:
    strategy:
      matrix:
        os: [ubuntu-latest]
        version: ["3.12"]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python ${{ matrix.version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.version }}
      - name: Install pre-commit
        run: |
          python -m pip install --upgrade pip
          python -m pip install '.[dev]'

      - name: Run pre-commit checks
        run: |
          pre-commit run --all-files
